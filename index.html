<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة المسابقات التفاعلية</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --box-bg: #ffffff;
            --text-color: #333333;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --btn-bg: #28a745;
            --btn-hover: #218838;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --box-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --btn-bg: #1e7e34;
            --btn-hover: #155724;
        }

        body { 
            font-family: Tahoma, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-color); 
            text-align: center; 
            padding: 30px; 
            transition: background 0.3s, color 0.3s;
        }
        .box { 
            background: var(--box-bg); 
            padding: 25px; 
            border-radius: 10px; 
            max-width: 480px; 
            margin: auto; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            transition: background 0.3s;
        }
        input, select, button { 
            width: 90%; 
            padding: 12px; 
            margin: 10px 0; 
            font-size: 16px; 
            border-radius: 5px; 
            border: 1px solid var(--input-border); 
            background: var(--input-bg);
            color: var(--text-color);
        }
        button { background: var(--btn-bg); color: white; border: none; cursor: pointer; }
        button:hover { background: var(--btn-hover); }
        .option-btn { background: #007bff; display: block; width: 90%; margin: 8px auto; color: white; }
        .option-btn:hover { background: #0056b3; }
        .home-btn { background: #6c757d; margin-top: 15px; color: white; }
        .home-btn:hover { background: #5a6268; }
        .theme-toggle {
            background: none;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            width: auto;
            padding: 8px 15px;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 20px;
        }
        .hidden { display: none; }
        #question-text { font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .feedback { font-size: 18px; font-weight: bold; margin: 15px 0; }
        .correct { color: #28a745; }
        .wrong { color: #dc3545; }
        label { display: block; text-align: right; margin-right: 5%; font-weight: bold; }
    </style>
</head>
<body>

    <!-- زر تبديل الثيم -->
    <button class="theme-toggle" id="theme-toggle-btn">🌙 الوضع المظلم</button>

    <!-- 1. شاشة تسجيل الدخول -->
    <div class="box" id="login-box">
        <h2>تسجيل الدخول للمسابقات</h2>
        <input type="text" id="playerName" placeholder="ادخل اسمك الكريم للبدء">
        <button id="login-btn">دخول</button>
    </div>

    <!-- 2. شاشة القائمة الرئيسية وإنشاء/انضمام الغرفة -->
    <div class="box hidden" id="menu-box">
        <h2>اختر إعدادات المسابقة</h2>
        
        <label>نوع الأسئلة:</label>
        <select id="categorySelect">
            <option value="quran">القرآن الكريم</option>
            <option value="ahlulbayt">أهل البيت عليهم السلام</option>
            <option value="wisdom">حكم وأقوال أهل البيت</option>
        </select>

        <label>مستوى الصعوبة:</label>
        <select id="difficultySelect">
            <option value="easy">سهلة</option>
            <option value="hard">صعبة</option>
        </select>

        <label>عدد الأسئلة:</label>
        <select id="questionCountSelect">
            <option value="10">10 أسئلة</option>
            <option value="20">20 سؤالاً</option>
            <option value="30">30 سؤالاً</option>
            <option value="40">40 سؤالاً</option>
            <option value="50">50 سؤالاً</option>
        </select>

        <label>عدد اللاعبين الأقصى:</label>
        <input type="number" id="maxPlayers" value="10" min="1" max="1000">
        
        <button id="create-btn">إنشاء غرفة جديدة</button>

        <hr>
        <h3>أو الانضمام لغرفة</h3>
        <input type="text" id="roomCodeInput" placeholder="رمز الغرفة (مثال: AB12)">
        <button id="join-btn">انضمام للغرفة</button>
    </div>

    <!-- 3. شاشة الانتظار -->
    <div class="box hidden" id="game-box">
        <h3>رمز الغرفة: <span id="display-code"></span></h3>
        <p>اللاعبون المتواجدون:</p>
        <ul id="players-list" style="list-style: none; padding: 0;"></ul>
        
        <button id="start-game-btn" class="hidden">بدء المسابقة</button>
        <p id="waiting-msg" class="hidden" style="opacity: 0.7;">انتظر حتى يقوم منشئ الغرفة ببدء المسابقة...</p>
        <button class="home-btn" onclick="location.reload()">الرجوع للرئيسية</button>
    </div>

    <!-- 4. شاشة الأسئلة واللعب -->
    <div class="box hidden" id="quiz-box">
        <h3 id="score-display">المجموع: 0</h3>
        <div id="question-container">
            <p id="question-text">جاري تحميل السؤال...</p>
            <div id="options-container"></div>
        </div>
        <div id="feedback-container" class="hidden">
            <p id="feedback-text" class="feedback"></p>
            <p style="opacity: 0.7; font-size: 14px;">انتظر حتى ينتهي باقي اللاعبين من الإجابة...</p>
        </div>
        <button id="back-to-home-btn" class="home-btn hidden" onclick="location.reload()">الرجوع للرئيسية</button>
    </div>

    <!-- 5. شاشة النهاية والنتائج -->
    <div class="box hidden" id="game-over-box">
        <h2>انتهت المسابقة!</h2>
        <h3>نتائج اللاعبين:</h3>
        <ul id="final-players-list" style="list-style: none; padding: 0;"></ul>
        <button id="play-again-btn" style="background: #28a745; color: white;">العب مرة أخرى (شاشة الاختيار)</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeToggleBtn.innerText = '🌙 الوضع المظلم';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleBtn.innerText = '☀️ الوضع الفاتح';
            }
        });

        const socket = io();

        let playerName = '';
        let currentRoom = '';
        let isHost = false;

        document.getElementById('login-btn').addEventListener('click', () => {
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                alert('الرجاء إدخال اسمك أولاً!');
                return;
            }
            playerName = nameInput;
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('menu-box').classList.remove('hidden');
        });

        document.getElementById('create-btn').addEventListener('click', () => {
            const category = document.getElementById('categorySelect').value;
            const difficulty = document.getElementById('difficultySelect').value;
            const questionCount = document.getElementById('questionCountSelect').value;
            const maxPlayers = document.getElementById('maxPlayers').value;

            isHost = true;
            socket.emit('create-room', { playerName, maxPlayers, category, difficulty, questionCount });
        });

        document.getElementById('join-btn').addEventListener('click', () => {
            const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!roomCode) {
                alert('الرجاء إدخال رمز الغرفة!');
                return;
            }
            isHost = false;
            socket.emit('join-room', { playerName, roomCode });
        });

        socket.on('room-created', ({ roomCode, players }) => {
            currentRoom = roomCode;
            document.getElementById('menu-box').classList.add('hidden');
            document.getElementById('game-box').classList.remove('hidden');
            document.getElementById('display-code').innerText = roomCode;
            
            if (isHost) {
                document.getElementById('start-game-btn').classList.remove('hidden');
            } else {
                document.getElementById('waiting-msg').classList.remove('hidden');
            }
            updatePlayersList(players);
        });

        socket.on('room-joined', ({ roomCode, players }) => {
            currentRoom = roomCode;
            document.getElementById('menu-box').classList.add('hidden');
            document.getElementById('game-box').classList.remove('hidden');
            document.getElementById('display-code').innerText = roomCode;
            document.getElementById('waiting-msg').classList.remove('hidden');
            updatePlayersList(players);
        });

        socket.on('update-players', (players) => {
            updatePlayersList(players);
        });

        function updatePlayersList(players) {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerText = p.name + (p.id === socket.id ? ' (أنت)' : '');
                list.appendChild(li);
            });
        }

        document.getElementById('start-game-btn').addEventListener('click', () => {
            socket.emit('start-game', currentRoom);
        });

        socket.on('game-started', () => {
            document.getElementById('game-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');
        });

        socket.on('new-question', (data) => {
            document.getElementById('feedback-container').classList.add('hidden');
            document.getElementById('question-container').classList.remove('hidden');
            
            document.getElementById('question-text').innerText = `السؤال (${data.questionIndex + 1} من ${data.total}): ${data.question}`;
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            data.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.addEventListener('click', () => {
                    socket.emit('submit-answer', { roomCode: currentRoom, answerIndex: index });
                    const allBtns = optionsContainer.querySelectorAll('button');
                    allBtns.forEach(b => b.disabled = true);
                });
                optionsContainer.appendChild(btn);
            });
        });

        socket.on('waiting-for-others', (data) => {
            document.getElementById('question-container').classList.add('hidden');
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackText = document.getElementById('feedback-text');
            
            feedbackContainer.classList.remove('hidden');
            if (data.isCorrect) {
                feedbackText.className = 'feedback correct';
                feedbackText.innerText = `إجابة صحيحة! (+${data.pointsEarned} نقاط)`;
            } else {
                feedbackText.className = 'feedback wrong';
                feedbackText.innerText = `إجابة خاطئة! الإجابة الصحيحة هي: ${data.correctAnswerText}`;
            }
        });

        socket.on('game-over', (players) => {
            document.getElementById('quiz-box').classList.add('hidden');
            const gameOverBox = document.getElementById('game-over-box');
            gameOverBox.classList.remove('hidden');

            const finalPlayersList = document.getElementById('final-players-list');
            finalPlayersList.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerText = `${p.name}: ${p.score} نقطة`;
                finalPlayersList.appendChild(li);
            });
        });

        document.getElementById('play-again-btn').addEventListener('click', () => {
            document.getElementById('game-over-box').classList.add('hidden');
            document.getElementById('menu-box').classList.remove('hidden');
        });

        socket.on('error-msg', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
